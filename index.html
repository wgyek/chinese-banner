<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Learning Banner</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .banner {
            display: flex;
            width: 100%;
            background-color: #D1D8F0; /* Requested periwinkle background */
            border: 1px solid #BAC4E8;
            border-radius: 12px;
            padding: 32px;
            box-sizing: border-box;
            color: #1F253D; /* Deep slate navy for high legibility */
        }

        .section-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .section-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .divider {
            width: 1px;
            background-color: #B4BFE3;
            margin: 0 40px;
        }

        .eyebrow {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #4B567E; /* Slate-indigo accent */
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            height: 6px;
            width: 6px;
            background-color: #4B567E;
            border-radius: 50%;
        }

        .greeting {
            font-size: 1.75rem;
            font-weight: 600;
            color: #1F253D;
            margin-bottom: 8px;
        }

        .greeting-highlight {
            color: #4B567E;
        }

        .datetime {
            font-size: 0.9rem;
            color: #556087;
            margin-bottom: 24px;
        }

        .main-tip {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.45;
            color: #1F253D;
            margin-bottom: 8px;
            max-width: 95%;
        }

        .sub-tip {
            font-size: 0.88rem;
            line-height: 1.4;
            color: #556087;
            margin-bottom: 24px;
            max-width: 90%;
        }

        /* Clickable button/badges */
        .badge {
            font-size: 0.85rem;
            font-weight: 500;
            color: #272F4F;
            border: 1px solid #9CAADA;
            border-radius: 20px;
            padding: 7px 18px;
            background-color: rgba(255, 255, 255, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .badge:hover {
            background-color: rgba(255, 255, 255, 0.65);
            border-color: #798CC9;
            transform: translateY(-1px);
        }

        /* Responsive stacking for narrow screens / mobile */
        @media (max-width: 768px) {
            .banner {
                flex-direction: column;
                padding: 24px;
            }
            .divider {
                width: 100%;
                height: 1px;
                margin: 24px 0;
            }
            .section-right {
                align-items: flex-start;
                text-align: left;
            }
            .eyebrow-right {
                flex-direction: row-reverse; 
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="banner">
        <!-- Left Section -->
        <div class="section-left">
            <div class="eyebrow"><div class="dot"></div> 用中文问好</div>
            <div class="greeting" id="greetingText">加载中...</div>
            <div class="datetime" id="datetimeDisplay">加载时间...</div>
            <!-- Replace YOUR_NOTION_PAGE_URL_HERE with your Notion note link -->
            <a href="YOUR_NOTION_PAGE_URL_HERE" target="_blank" class="badge">
                新建课堂笔记 &rarr;
            </a>
        </div>

        <!-- Vertical Divider -->
        <div class="divider"></div>

        <!-- Right Section -->
        <div class="section-right">
            <div class="eyebrow eyebrow-right">每日自勉 <div class="dot"></div></div>
            <div class="main-tip">我们日复一日的重复，造就了现在的我们。卓越并非一时的行为，而是一种习惯。</div>
            <div class="sub-tip">语言不是一蹴而就的奇迹，而是每天坚持的沉淀。</div>
            <a href="https://papago.naver.com/" target="_blank" class="badge">
                立即翻译 &rarr;
            </a>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hour = now.getHours();
            let minutes = now.getMinutes();
            let ampm = hour >= 12 ? "下午" : "上午";
            
            let displayHour = hour % 12;
            displayHour = displayHour ? displayHour : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;

            const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const months = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            
            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const dateNumber = now.getDate();

            const timeString = `${dayName}, ${monthName} ${dateNumber}日 · ${displayHour}:${minutes} ${ampm}`;
            document.getElementById('datetimeDisplay').innerText = timeString;

            let greetingHTML = "";
            if (hour < 12) {
                greetingHTML = `<span class="greeting-highlight">早上好。</span>开启新的一天？`;
            } else if (hour < 18) {
                greetingHTML = `<span class="greeting-highlight">下午好。</span>继续努力？`;
            } else {
                greetingHTML = `<span class="greeting-highlight">晚上好。</span>还没睡吗？`;
            }
            document.getElementById('greetingText').innerHTML = greetingHTML;
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
