<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Learning Banner</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .banner {
            text-align: center;
            padding: 24px;
            border-radius: 12px;
            background: #F7F7F5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
        }
        .greeting-hanzi {
            font-size: 2.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .greeting-pinyin {
            font-size: 1rem;
            color: #888;
            margin-bottom: 12px;
            font-style: italic;
        }
        .subtitle {
            font-size: 1.05rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="greeting-hanzi" id="greetHanzi">你好</div>
        <div class="greeting-pinyin" id="greetPinyin">nǐ hǎo</div>
        <div class="subtitle">今天准备好学习中文了吗？</div>
    </div>

    <script>
        const hour = new Date().getHours();
        let hanzi = "你好";
        let pinyin = "nǐ hǎo";

        if (hour < 12) {
            hanzi = "早上好";
            pinyin = "zǎoshang hǎo";
        } else if (hour < 18) {
            hanzi = "下午好";
            pinyin = "xiàwǔ hǎo";
        } else {
            hanzi = "晚上好";
            pinyin = "wǎnshang hǎo";
        }

        document.getElementById("greetHanzi").innerText = hanzi;
        document.getElementById("greetPinyin").innerText = pinyin;
    </script>
</body>
</html>
